name: Build Android APK
on:
  workflow_dispatch:      # Manual only — click "Run workflow" in the Actions tab.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Setup tools direct din environment ───────────────────────────
      - name: Show pre-installed tool versions
        run: |
          echo "Node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Ensure Java 17 is selected
        run: |
          JAVA17=$(ls -d /usr/lib/jvm/temurin-17* /usr/lib/jvm/*17* 2>/dev/null | head -1)
          if [ -z "$JAVA17" ]; then
            sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
            JAVA17=$(ls -d /usr/lib/jvm/*17* | head -1)
          fi
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"

      - name: Ensure Android SDK 35 is installed
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ] && [ -n "$(which sdkmanager)" ]; then SDKMGR=$(which sdkmanager); fi
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null 2>&1 || true
          fi

      # ── Strategie stabilă de Versioning ──────────────────────────────
      - name: Compute version constants
        id: version
        run: |
          # Extrage versiunea curată din app.json (ex: 2.0)
          VERSION_BASE=$(node -p "require('./app.json').expo.version || require('./app.json').version")
          
          # PUNEM UN OFFSET (+100) CA SĂ FIM SIGURI CĂ DEPĂȘIM VERSIUNEA 106 DIN GOOGLE PLAY
          GIT_COMMITS=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((GIT_COMMITS + 100))
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Numele versiunii finale (ex: 2.0-b142)
          VERSION_NAME="${VERSION_BASE}-b${BUILD_NUMBER}"
          
          echo "vcode=${BUILD_NUMBER}"             >> "$GITHUB_OUTPUT"
          echo "vname=${VERSION_NAME}"             >> "$GITHUB_OUTPUT"
          echo "base=${VERSION_BASE}"              >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"            >> "$GITHUB_OUTPUT"
          echo "apk_name=svara-yoga-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "aab_name=svara-yoga-v${VERSION_NAME}.aab" >> "$GITHUB_OUTPUT"
          
          echo "Building Svara Yoga version: ${VERSION_NAME} (Code: ${BUILD_NUMBER})"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      # ── Remediu critic: Blocare Sonatype 504 Gateway Time-out ───────
      - name: Strip broken Sonatype repositories from generated files
        run: |
          echo "Cleaning snapshot repositories from build.gradle files..."
          find android -name "build.gradle" -type f -exec sed -i '/oss.sonatype.org\/content\/repositories\/snapshots/d' {} +
          find android -name "build.gradle" -type f -exec sed -i '/sonatype.org/d' {} +

      - name: Patch expo-modules-core for SDK 35 nullability
        run: |
          F=node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt
          if [ -f "$F" ] && grep -q "return requestedPermissions\.contains(permission)" "$F"; then
            sed -i 's/return requestedPermissions\.contains(permission)/return requestedPermissions?.contains(permission) ?: false/' "$F"
            echo "✅ Patch implemented successfully"
          fi

      - name: Bundle JavaScript assets
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Extract signing keystore
        id: keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "have_release_key=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SIGNING_KEY" | tr -d '[:space:]' | base64 -d > android/app/release.keystore
            if ! keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "❌ ERROR: KEYSTORE_PASSWORD verification failed!"
              exit 1
            fi
            echo "have_release_key=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Build curat cu injectare securizată de argumente ───────────
      - name: Compile Release APK and AAB
        run: |
          cd android
          
          # Parametrii comuni injectați direct în Gradle pentru versiuni
          GRADLE_ARGS="-PapkName=${{ steps.version.outputs.apk_name }} -Pandroid.injected.version.code=${{ steps.version.outputs.vcode }} -Pandroid.injected.version.name=${{ steps.version.outputs.vname }}"
          
          # Injectare dinamică a acreditărilor de securitate (fără rescriere de fișiere)
          if [ "${{ steps.keystore.outputs.have_release_key }}" = "true" ]; then
            echo "Compiling with Production Release Signing..."
            ./gradlew assembleRelease bundleRelease $GRADLE_ARGS \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}" \
              --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          else
            echo "Compiling with fallback Debug Signing..."
            ./gradlew assembleRelease bundleRelease $GRADLE_ARGS \
              --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          fi
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Process and gather output artifacts
        id: rename
        run: |
          mkdir -p dist
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          AAB_SRC=$(find android/app/build/outputs/bundle/release -name "*.aab" -type f | head -1)
          
          cp "$APK_SRC" "dist/${{ steps.version.outputs.apk_name }}"
          cp "$AAB_SRC" "dist/${{ steps.version.outputs.aab_name }}"
          
          echo "apk_path=dist/${{ steps.version.outputs.apk_name }}" >> "$GITHUB_OUTPUT"
          echo "aab_path=dist/${{ steps.version.outputs.aab_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: svara-yoga-build-${{ steps.version.outputs.vname }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.vname }}
          name: Svara Yoga v${{ steps.version.outputs.vname }}
          body: |
            ### Svara Yoga Production Build
            
            - **Version Display (Name):** `${{ steps.version.outputs.vname }}`
            - **Play Store Version Code:** `${{ steps.version.outputs.vcode }}`
            - **Base Manifest Version:** `${{ steps.version.outputs.base }}`
            - **Git Commit:** `${{ steps.version.outputs.short_sha }}`
            - **Signing Security:** `${{ steps.keystore.outputs.have_release_key == 'true' && '🔒 RELEASE (Google Play Ready)' || '⚠️ DEBUG' }}`
            
            * Pentru testare rapidă pe dispozitiv, descărcați fișierul `.apk`.
            * Pentru actualizări în Google Play Console, folosiți pachetul `.aab`.
          files: |
            dist/${{ steps.version.outputs.apk_name }}
            dist/${{ steps.version.outputs.aab_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
