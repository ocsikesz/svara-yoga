name: Build Android APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java and SDK
        run: |
          sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Compute version
        id: version
        run: |
          VERSION_BASE=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 200 ))
          VERSION_NAME="${VERSION_BASE}-b${BUILD_NUMBER}"
          echo "full=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=svara-yoga-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "aab_name=svara-yoga-v${VERSION_NAME}.aab" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Prebuild and Inject Kotlin Fix
        run: |
          npx expo prebuild --platform android --clean --no-install
          
          # Fix Kotlin 1.9.24 si suprimare eroare Compose
          sed -i 's/kotlinVersion = .*/kotlinVersion = "1.9.24"/' android/build.gradle || true
          cat << 'EOF' >> android/build.gradle

          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += [
                          "-P", "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                      ]
                  }
              }
          }
          EOF

      - name: Bundle JavaScript
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Decode keystore
        id: keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | tr -d '[:space:]' | base64 -d > android/app/release.keystore
            echo "have_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_release_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.have_release_key }}" = "true" ]; then
            ./gradlew clean assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}" \
              --no-daemon --stacktrace
          else
            ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace
          fi
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Collect Artifacts
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          AAB=$(find android/app/build/outputs -name "*.aab" | head -1)
          if [ -z "$APK" ] || [ -z "$AAB" ]; then echo "❌ Nu s-au generat fișiere"; exit 1; fi
          cp "$APK" "dist/${{ steps.version.outputs.apk_name }}"
          cp "$AAB" "dist/${{ steps.version.outputs.aab_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svara-yoga-release
          path: dist/
