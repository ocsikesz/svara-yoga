name: Generate Release Keystore (one-time)

# IMPORTANT — Run this ONCE to create your Android release keystore.
# After it succeeds, download the artifact, save it safely, add it as a
# secret, and you'll never need to run this workflow again.
#
# Required secrets (Settings → Secrets and variables → Actions → New
# repository secret) BEFORE running:
#   - KEYSTORE_PASSWORD   : password protecting the keystore file
#   - KEY_PASSWORD        : password protecting the key inside
#   - KEY_ALIAS           : short name for the key (e.g. svarayoga)
#   - KEY_DNAME           : certificate identity, format:
#                           CN=Your Name, O=Svara Yoga, L=Targu Mures, ST=Mures, C=RO

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets exist
        env:
          KP:  ${{ secrets.KEYSTORE_PASSWORD }}
          KEYP: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          DNAME: ${{ secrets.KEY_DNAME }}
        run: |
          missing=""
          [ -z "$KP" ]    && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEYP" ]  && missing="$missing KEY_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$DNAME" ] && missing="$missing KEY_DNAME"
          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            echo "Add them in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "✅ All 4 secrets present"

      - name: Find Java keytool
        run: |
          which keytool || (echo "❌ keytool not found" && exit 1)
          keytool -help 2>&1 | head -1 || true

      - name: Generate keystore
        env:
          KP:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEYP:  ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          DNAME: ${{ secrets.KEY_DNAME }}
        run: |
          # Generate a 25-year RSA 2048-bit keystore (Play recommends 25+ years)
          keytool -genkeypair \
            -v \
            -keystore svarayoga-release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -storepass "$KP" \
            -keypass "$KEYP" \
            -dname "$DNAME"
          echo ""
          echo "=== Keystore details ==="
          keytool -list -v -keystore svarayoga-release.keystore -storepass "$KP" | head -25

      - name: Encode keystore to base64 (for the SIGNING_KEY secret)
        run: |
          base64 -w 0 svarayoga-release.keystore > svarayoga-release.keystore.base64.txt
          echo "Base64 length: $(wc -c < svarayoga-release.keystore.base64.txt) chars"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svarayoga-keystore
          path: |
            svarayoga-release.keystore
            svarayoga-release.keystore.base64.txt
          retention-days: 7
