name: Build Android APK
on:
  workflow_dispatch:      # Manual only — click "Run workflow" in the Actions tab.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Setup WITHOUT external setup-* actions ───────────────────────────
      # ubuntu-latest ships with Node 20, Java 17 and the Android SDK already
      # installed. We point to them directly, avoiding the codeload download
      # of setup-node / setup-java / setup-android that was failing.
      - name: Show pre-installed tool versions
        run: |
          echo "Node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Ensure Java 17 is selected
        run: |
          JAVA17=$(ls -d /usr/lib/jvm/temurin-17* /usr/lib/jvm/*17* 2>/dev/null | head -1)
          if [ -z "$JAVA17" ]; then
            sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
            JAVA17=$(ls -d /usr/lib/jvm/*17* | head -1)
          fi
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"
          echo "Selected JAVA_HOME=$JAVA17"

      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./app.json').expo.version")
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          BUILD=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL="${MAJOR}.${BUILD}"
          echo "base=${BASE}"          >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}"        >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"        >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}"          >> "$GITHUB_OUTPUT"
          echo "apk_name=svara-yoga-v${FULL}.apk" >> "$GITHUB_OUTPUT"
          echo "Building Svara Yoga v${FULL} (commit ${SHORT_SHA})"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      - name: Bundle JavaScript into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Sign release with debug key
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Rename APK with version
        id: rename
        run: |
          mkdir -p dist
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          DST="dist/${{ steps.version.outputs.apk_name }}"
          cp "$SRC" "$DST"
          ls -lh dist/
          echo "apk_path=${DST}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svara-yoga-v${{ steps.version.outputs.full }}
          path: dist/${{ steps.version.outputs.apk_name }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.full }}
          name: Svara Yoga v${{ steps.version.outputs.full }}
          body: |
            Svara Yoga v${{ steps.version.outputs.full }}

            - Base version: ${{ steps.version.outputs.base }}
            - Build number: ${{ steps.version.outputs.build }}
            - Commit: ${{ steps.version.outputs.short_sha }}

            Download the APK below, uninstall any older version, then install.
          files: dist/${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
