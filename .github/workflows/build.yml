name: Build Android APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Java 17 and SDK 35
        run: |
          sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Compute version
        id: version
        run: |
          VERSION_BASE=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 100 ))
          VERSION_NAME="${VERSION_BASE}-b${BUILD_NUMBER}"
          echo "vcode=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "vname=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Force Fix Sonatype Snapshots
        run: |
          find android -name "build.gradle" -type f -exec sed -i '/sonatype/d' {} +
          echo "allprojects { gradle.projectsEvaluated { repositories.removeIf { it.name.contains('sonatype') } } }" >> android/build.gradle

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Compile
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Process artifacts
        run: |
          mkdir -p dist
          # Căutăm orice apk/aab în tot arborele de build
          APK=$(find . -name "*.apk" | grep "release" | head -1)
          AAB=$(find . -name "*.aab" | grep "release" | head -1)
          
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "❌ BUILD FAILED: Fișierele release nu există."
            echo "Structura de fișiere generată:"
            find android/app/build/outputs -maxdepth 4
            exit 1
          fi
          
          cp "$APK" "dist/svara-yoga-v${{ steps.version.outputs.vname }}.apk"
          cp "$AAB" "dist/svara-yoga-v${{ steps.version.outputs.vname }}.aab"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: svara-yoga-build
          path: dist/
